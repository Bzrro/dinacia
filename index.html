<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DINACIA — Mapa</title>
<meta name="theme-color" content="#0d2b4e">
<meta name="apple-mobile-web-app-title" content="DINACIA">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<style>
  :root {
    --azul-osc: #0d2b4e;
    --azul: #1b4f8c;
    --azul-med: #2e6db4;
    --azul-claro: #eaf2fb;
    --acento: #ffcc33;
    --panel: #ffffff;
    --ink: #10233c;
    --ink-soft: #5c7291;
    --line: #d7e3f2;
    --shadow: 0 10px 28px rgba(13, 43, 78, 0.22);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--azul-osc);
    color: var(--ink);
    overflow: hidden;
  }
  #map { position: absolute; inset: 0; z-index: 0; }

  /* Tinte azulado sobre las tiles */
  .leaflet-tile-pane { filter: grayscale(0.35) sepia(0.35) hue-rotate(175deg) saturate(1.7) brightness(1.05); }

  .topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 500;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 10px;
    background: linear-gradient(180deg, rgba(13,43,78,0.92), rgba(13,43,78,0));
    pointer-events: none;
  }
  .topbar * { pointer-events: auto; }
  .brand {
    color: #fff; font-weight: 700; font-size: 1rem;
    display: flex; align-items: center; gap: 8px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  .brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--acento); box-shadow: 0 0 0 4px rgba(255,204,51,0.25); }

  .topActions { display: flex; gap: 10px; }
  #pistaBtn {
    background: var(--panel);
    border: none;
    color: var(--azul-osc);
    font-size: 1.3rem;
    width: 46px; height: 46px;
    border-radius: 50%;
    box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  #pistaBtn.active {
    background: var(--azul);
    color: #fff;
  }
  #pistaBtn:active { transform: scale(0.92); }
  #sombras { position: fixed; inset: 0; z-index: 400; pointer-events: none; overflow: hidden; }
  .sombra { position: absolute; left: 0; top: 0; opacity: 0; will-change: transform, opacity; filter: blur(1.6px); }
  .sombra svg { width: 100%; height: 100%; display: block; fill: #0d2b4e; }

  #locateBtn {
    position: absolute; z-index: 500; right: 14px; bottom: 80px;
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: var(--panel); box-shadow: var(--shadow);
    font-size: 1.15rem; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--azul);
    transition: bottom 0.28s ease;
  }
  #locateBtn.raised { bottom: calc(46vh + 16px); }

  #accBadge {
    position: absolute; z-index: 500; left: 14px; bottom: 80px;
    background: rgba(13,43,78,0.85); color: #fff;
    font-size: 0.72rem; font-weight: 600;
    padding: 6px 11px; border-radius: 999px;
    display: none; align-items: center; gap: 5px;
    transition: bottom 0.28s ease;
  }
  #accBadge.show { display: flex; }
  #accBadge.warn { background: rgba(196,90,20,0.9); }
  #accBadge.raised { bottom: calc(46vh + 16px); }

  /* Botón 📍: menú, globito de ayuda, aviso de interiores y mensajes */
  #locMenu {
    position: absolute; z-index: 520; right: 14px; bottom: 134px; width: min(78vw, 290px);
    background: var(--panel); border-radius: 16px; box-shadow: var(--shadow); padding: 8px; display: none;
    transition: bottom 0.28s ease;
  }
  #locMenu.show { display: block; }
  #locMenu.raised { bottom: calc(46vh + 70px); }
  #locMenu .t { font-size: 0.7rem; font-weight: 700; color: var(--azul-med); text-transform: uppercase; letter-spacing: 0.06em; padding: 6px 8px 4px; }
  #locMenu button { display: flex; align-items: center; gap: 10px; width: 100%; border: none; background: transparent; padding: 11px 8px; border-radius: 10px; font-size: 0.88rem; color: var(--ink); text-align: left; cursor: pointer; line-height: 1.25; }
  #locMenu button:active { background: var(--azul-claro); }
  #locMenu button small { display: block; font-size: 0.72rem; color: var(--ink-soft); }
  #locHint {
    position: absolute; z-index: 510; right: 66px; bottom: 90px; background: rgba(13,43,78,0.92); color: #fff;
    font-size: 0.76rem; font-weight: 600; padding: 7px 12px; border-radius: 12px; display: none; max-width: 52vw;
    transition: bottom 0.28s ease, opacity 0.5s ease;
  }
  #locHint::after { content: ""; position: absolute; right: -6px; top: 50%; margin-top: -6px; border: 6px solid transparent; border-left-color: rgba(13,43,78,0.92); border-right: 0; }
  #locHint.show { display: block; }
  #locHint.raised { bottom: calc(46vh + 26px); }
  .banner {
    position: fixed; z-index: 530; left: 50%; transform: translateX(-50%); width: min(92vw, 420px);
    background: rgba(13,43,78,0.96); color: #fff; border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow);
    font-size: 0.84rem; line-height: 1.4; display: none;
  }
  .banner.show { display: block; }
  .banner .acc { display: flex; gap: 8px; margin-top: 10px; }
  .banner button { flex: 1; border: none; border-radius: 10px; padding: 9px 6px; font-weight: 700; font-size: 0.8rem; cursor: pointer; background: rgba(255,255,255,0.18); color: #fff; }
  .banner button.main { background: #ffcc33; color: var(--azul-osc); }
  #colocarBanner { top: 126px; }
  #avisoInterior { bottom: 96px; background: #fff; color: var(--ink); border: 1px solid #f0c27a; }
  #avisoInterior b { color: #b45a14; }
  #avisoInterior button { background: var(--azul-claro); color: var(--azul); }
  #avisoInterior button.main { background: var(--azul); color: #fff; }
  #toastMsg {
    position: fixed; z-index: 560; left: 50%; transform: translateX(-50%); bottom: 150px; max-width: 88vw;
    background: rgba(13,43,78,0.94); color: #fff; font-size: 0.8rem; line-height: 1.4; padding: 10px 14px; border-radius: 14px;
    box-shadow: var(--shadow); display: none; text-align: center;
  }
  #toastMsg.show { display: block; }
  #map.colocando { cursor: crosshair; }
  .tipPartida { background: #ffcc33; color: #0d2b4e; border: none; font-weight: 700; font-size: 0.72rem; box-shadow: var(--shadow); padding: 3px 8px; }
  .tipPartida::before { border-top-color: #ffcc33 !important; }

  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 500;
    background: var(--panel);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -8px 24px rgba(13,43,78,0.18);
    max-height: 46vh;
    display: flex; flex-direction: column;
    transition: max-height 0.28s ease;
  }
  .sheet.collapsed { max-height: 64px; }
  .sheet.collapsed .list { display: none; }
  .sheet-handle {
    width: 40px; height: 4px; border-radius: 2px; background: var(--line);
    margin: 10px auto 6px;
  }
  .sheet-title {
    padding: 0 18px 8px; font-size: 0.95rem; font-weight: 700; color: var(--azul-osc);
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer;
  }
  .sheet-title .chev {
    font-size: 0.75rem; color: var(--ink-soft); margin-left: 8px;
    transition: transform 0.28s ease;
  }
  .sheet.collapsed .sheet-title .chev { transform: rotate(180deg); }
  .sheet-title span.mode {
    font-size: 0.72rem; font-weight: 600; color: var(--azul-med);
    background: var(--azul-claro); padding: 3px 9px; border-radius: 999px;
  }
  .list { overflow-y: auto; padding: 0 10px 14px; }
  .poi {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 10px; border-radius: 12px; cursor: pointer;
    border: 1px solid transparent;
  }
  .poi:active { background: var(--azul-claro); }
  .poi.selected { background: var(--azul-claro); border-color: var(--azul-med); }
  .poi-ico {
    width: 34px; height: 34px; border-radius: 10px;
    background: var(--azul-claro); color: var(--azul);
    display: flex; align-items: center; justify-content: center; font-size: 1.05rem;
    flex-shrink: 0;
  }
  .poi.selected .poi-ico { background: var(--azul); color: #fff; }
  .poi-txt { flex: 1; min-width: 0; }
  .poi-name { font-size: 0.9rem; font-weight: 600; color: var(--ink); line-height: 1.25; }
  .poi-sub { font-size: 0.76rem; color: var(--ink-soft); margin-top: 1px; }
  .poi-dist { font-size: 0.74rem; color: var(--azul-med); font-weight: 600; white-space: nowrap; }

  .leaflet-popup-content-wrapper { border-radius: 12px; }
  .leaflet-popup-content { font-size: 0.85rem; color: var(--ink); }

  .divicon-user {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--azul-med); border: 3px solid #fff;
    box-shadow: 0 0 0 6px rgba(46,109,180,0.25), 0 2px 6px rgba(0,0,0,0.3);
  }
  .divicon-user.plane {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--acento); border: none;
    box-shadow: 0 0 0 7px rgba(255,204,51,0.28), 0 3px 8px rgba(0,0,0,0.35);
    display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .divicon-poi {
    background: var(--azul); color: #fff; box-shadow: 0 3px 8px rgba(13,43,78,0.35);
    padding: 4px 8px; border-radius: 8px; position: relative;
    font-size: 10.5px; font-weight: 700; white-space: nowrap; text-align: center;
    display: flex; align-items: center; justify-content: center;
  }
  .divicon-poi::after {
    content: ""; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%);
    border-left: 6px solid transparent; border-right: 6px solid transparent;
    border-top: 6px solid var(--azul);
  }
  .divicon-poi { transition: opacity 0.25s ease; }
  #map.plan-on .divicon-poi { opacity: 0; pointer-events: none; }
  .divicon-poi.pin-oculto { opacity: 0 !important; pointer-events: none !important; }
  .divicon-poi span { color: #fff; }
  .divicon-poi.plane { background: var(--acento); }
  .divicon-poi.plane::after { border-top-color: var(--acento); }
  .divicon-poi.plane span { color: var(--azul-osc); }

  /* Selector de piso */
  #floorSelector {
    position: absolute; z-index: 500; top: 66px; left: 50%; transform: translateX(-50%);
    display: none; gap: 4px;
    background: rgba(255,255,255,0.95); padding: 4px; border-radius: 999px;
    box-shadow: var(--shadow);
  }
  #floorSelector.show { display: flex; }
  #floorSelector button {
    border: none; background: transparent; color: var(--ink-soft);
    font-size: 0.8rem; font-weight: 700; padding: 6px 13px; border-radius: 999px;
    cursor: pointer;
  }
  #floorSelector button.active { background: var(--azul); color: #fff; }

  /* Tira de fotos del lugar seleccionado */
  #photoStrip {
    position: absolute; z-index: 500; left: 0; right: 0;
    bottom: calc(46vh + 14px);
    display: none; gap: 8px; padding: 10px 14px;
    overflow-x: auto;
    transition: bottom 0.28s ease;
  }
  #photoStrip.show { display: flex; }
  #photoStrip img {
    height: 64px; width: 88px; object-fit: cover; border-radius: 10px;
    box-shadow: var(--shadow); cursor: pointer; flex-shrink: 0;
  }

  /* Lightbox de foto a pantalla completa */
  #lightbox {
    position: fixed; inset: 0; z-index: 2000; background: rgba(10,20,35,0.92);
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  #lightbox.show { display: flex; }
  #lightbox img { max-width: 100%; max-height: 82vh; border-radius: 10px; transition: transform 0.05s linear; touch-action: none; }
  #lightbox img.zoomable { max-height: 90vh; background: #fff; cursor: grab; }
  #lightbox .hint {
    position: absolute; bottom: 22px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,0.65); font-size: 0.78rem;
  }
  #lightbox .close {
    position: absolute; top: 22px; right: 20px; color: #fff; font-size: 1.6rem;
    background: rgba(255,255,255,0.15); width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; cursor: pointer; border: none;
  }

  #lightboxStage { position: relative; line-height: 0; touch-action: none; transition: transform 0.05s linear; }
  #lightboxStage img { display: block; max-width: calc(100vw - 48px); max-height: 86vh; width: auto; height: auto; border-radius: 10px; transition: none; }
  #lightboxStage img.zoomable { max-height: 88vh; background: #fff; cursor: grab; }

  /* Zonas tocables del plano (como los lugares de Google Maps) */
  .spotHit { position: absolute; cursor: pointer; pointer-events: auto; border-radius: 6px; -webkit-tap-highlight-color: transparent; }
  .spotHit:active { background: rgba(245,184,61,0.28); }
  .spotBadge {
    position: absolute; width: 4.8%; aspect-ratio: 1 / 1; transform: translate(-50%, -50%);
    border-radius: 50%; background: #f5b83d; border: 2px solid #fff; pointer-events: auto; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(13,43,78,0.4); animation: spotPulse 1.8s ease-out infinite;
  }
  .spotBadge svg { width: 62%; height: 62%; }
  @keyframes spotPulse { 0% { box-shadow: 0 0 0 0 rgba(245,184,61,0.6); } 100% { box-shadow: 0 0 0 14px rgba(245,184,61,0); } }

  /* Tarjeta con foto al tocar un lugar */
  #spotCard {
    position: fixed; z-index: 2600; left: 50%; transform: translateX(-50%); bottom: 84px;
    width: min(92vw, 380px); background: #fff; border-radius: 18px; overflow: hidden;
    box-shadow: 0 12px 34px rgba(13,43,78,0.38); display: none;
  }
  #spotCard.show { display: block; }
  #spotCard .cardPhotos { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  #spotCard .cardPhotos::-webkit-scrollbar { display: none; }
  #spotCard .cardPhotos img { flex: 0 0 100%; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; scroll-snap-align: start; cursor: zoom-in; object-position: 50% 38%; }
  #spotCard .cardTxt { padding: 10px 16px 14px; }
  #spotCard .cardTxt b { display: block; font-size: 1rem; color: var(--azul-osc); }
  #spotCard .cardTxt span { font-size: 0.82rem; color: var(--ink-soft); }
  #spotCard .cardDots { position: absolute; left: 0; right: 0; top: calc((min(92vw, 380px) * 0.75) - 22px); display: flex; justify-content: center; gap: 6px; pointer-events: none; }
  #spotCard .cardDots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.55); }
  #spotCard .cardDots i.on { background: #fff; }
  #spotCard .cardClose {
    position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 50%; border: none;
    background: rgba(13,43,78,0.65); color: #fff; font-size: 1rem; cursor: pointer; z-index: 2;
  }
  #photoViewer {
    position: fixed; inset: 0; z-index: 3000; background: rgba(8,16,28,0.95); display: none;
    align-items: center; justify-content: center; padding: 12px;
  }
  #photoViewer.show { display: flex; }
  #photoViewer img { max-width: 100%; max-height: 92vh; border-radius: 10px; }

  /* Muñequito = tu ubicación */
  .mono { width: 36px; height: 48px; animation: monoBob 2.2s ease-in-out infinite; filter: drop-shadow(0 3px 4px rgba(13,43,78,0.4)); }
  .mono svg { width: 100%; height: 100%; display: block; }
  @keyframes monoBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }

  /* Panel de la izquierda: lugares y cómo llegar */
  #navBtn {
    position: absolute; z-index: 500; top: 66px; left: 14px; width: 46px; height: 46px; border-radius: 50%;
    border: none; background: var(--panel); box-shadow: var(--shadow); font-size: 1.3rem;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  #navBtn:active { transform: scale(0.92); }
  #navScrim { position: fixed; inset: 0; z-index: 2150; background: rgba(8,16,28,0.38); display: none; }
  #navScrim.show { display: block; }
  #navDrawer {
    position: fixed; z-index: 2200; top: 0; bottom: 0; left: 0; width: min(88vw, 360px); background: #fff;
    box-shadow: 8px 0 30px rgba(13,43,78,0.3); transform: translateX(-105%); transition: transform 0.28s ease;
    display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px);
  }
  #navDrawer.open { transform: translateX(0); }
  .navHead { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 6px; font-size: 1.1rem; color: var(--azul-osc); }
  .navHead button { border: none; background: var(--azul-claro); color: var(--azul); width: 34px; height: 34px; border-radius: 50%; font-size: 1rem; cursor: pointer; }
  .navBody { overflow-y: auto; padding: 6px 12px 28px; flex: 1; }
  .navFrom { display: block; font-size: 0.76rem; color: var(--ink-soft); margin: 4px 4px 8px; }
  .navFrom select { width: 100%; margin-top: 4px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); font-size: 0.9rem; background: #fff; color: var(--ink); }
  .navGroup { font-size: 0.7rem; font-weight: 700; color: var(--azul-med); text-transform: uppercase; letter-spacing: 0.06em; margin: 14px 6px 4px; }
  .navPlace { display: flex; align-items: center; gap: 10px; padding: 9px 8px; border-radius: 12px; cursor: pointer; }
  .navPlace:active { background: var(--azul-claro); }
  .navPlace .ico { width: 36px; height: 36px; border-radius: 10px; background: var(--azul-claro); display: flex; align-items: center; justify-content: center; font-size: 1.05rem; flex-shrink: 0; }
  .navPlace .t { flex: 1; min-width: 0; }
  .navPlace .t b { display: block; font-size: 0.9rem; color: var(--ink); line-height: 1.2; }
  .navPlace .t span { font-size: 0.74rem; color: var(--ink-soft); }
  .navPlace .d { font-size: 0.74rem; color: var(--azul-med); font-weight: 700; white-space: nowrap; text-align: right; }
  .navBack { border: none; background: transparent; color: var(--azul); font-weight: 700; padding: 8px 4px; cursor: pointer; font-size: 0.9rem; }
  #navRouteTitle { margin: 2px 4px 0; font-size: 1.05rem; color: var(--azul-osc); }
  #navRouteMeta { margin: 2px 4px 6px; font-size: 0.8rem; color: var(--ink-soft); }
  .navBtns { display: flex; gap: 8px; margin: 10px 0 4px; }
  .navBtns button { flex: 1; padding: 11px 6px; border-radius: 12px; border: none; font-weight: 700; font-size: 0.82rem; cursor: pointer; background: var(--azul-claro); color: var(--azul); }
  .navBtns button.main { background: var(--azul); color: #fff; }
  .navSteps { list-style: none; padding: 0; margin: 6px 0 0; }
  .navSteps li { display: flex; gap: 10px; padding: 8px 4px; font-size: 0.9rem; line-height: 1.35; color: var(--ink); }
  .navSteps .n { flex: 0 0 24px; height: 24px; border-radius: 50%; background: var(--azul); color: #fff; font-size: 0.74rem; display: flex; align-items: center; justify-content: center; font-weight: 700; margin-top: 1px; }
  .navSteps .piso { display: block; font-size: 0.72rem; font-weight: 700; color: var(--azul-med); margin: 12px 4px 0; text-transform: uppercase; letter-spacing: 0.05em; padding: 0; }
  #routeChip {
    position: fixed; z-index: 520; left: 50%; transform: translateX(-50%); top: 126px; max-width: 92vw;
    background: rgba(13,43,78,0.94); color: #fff; border-radius: 999px; padding: 7px 7px 7px 14px; font-size: 0.8rem;
    display: none; align-items: center; gap: 8px; box-shadow: var(--shadow); white-space: nowrap;
  }
  #routeChip.show { display: flex; }
  #routeChip .txt { overflow: hidden; text-overflow: ellipsis; }
  #routeChip button { border: none; border-radius: 999px; padding: 6px 11px; font-size: 0.78rem; font-weight: 700; cursor: pointer; flex-shrink: 0; }
  #routeChip .go { background: #ffcc33; color: var(--azul-osc); }
  #routeChip .x { background: rgba(255,255,255,0.18); color: #fff; }
</style>
</head>
<body>

<div id="map"></div>

<div class="topbar">
  <div class="brand"><span class="dot"></span> DINACIA</div>
  <div class="topActions">
    <button id="pistaBtn" title="Modo pista">✈️</button>
  </div>
</div>
<div id="sombras" aria-hidden="true"></div>

<div id="floorSelector"></div>
<button id="navBtn" title="Lugares y cómo llegar">🧭</button>
<div id="routeChip"><span class="txt" id="routeChipTxt"></span><button class="go" id="routeChipGo">Pasos</button><button class="x" id="routeChipX">✕</button></div>
<div id="navScrim"></div>
<aside id="navDrawer" aria-label="Lugares y cómo llegar">
  <div class="navHead"><b>¿A dónde vas?</b><button id="navClose" aria-label="Cerrar">✕</button></div>
  <div class="navBody" id="navListView">
    <label class="navFrom">Desde<select id="navFrom"></select></label>
    <div id="navPlaces"></div>
  </div>
  <div class="navBody" id="navRouteView" style="display:none">
    <button class="navBack" id="navBack">← Lugares</button>
    <h3 id="navRouteTitle"></h3>
    <div id="navRouteMeta"></div>
    <div class="navBtns"><button class="main" id="navShow">Ver en el mapa</button><button id="navFloorA"></button><button id="navFloorB"></button></div>

  // ---------------------------------------------------------------
  // MAPA
  // ---------------------------------------------------------------
  const center = [-34.84635, -56.02895];
  // Límite geográfico: no deja alejarse (pan) de la zona de DINACIA,
  // pero el zoom (acercarse) sigue libre dentro de ese rectángulo.

  const map = L.map("map", {

  }).setView(center, 18);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 22,
    maxNativeZoom: 19,
    subdomains: "abc",
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  L.control.zoom({ position: "bottomright" }).addTo(map);

  // ---------------------------------------------------------------
  // Plano calzado y rotado sobre el mapa real. Las esquinas fueron
  // relevadas con GPS parado en el lugar (no son una suposición).
  // Como es el mismo edificio, PB y 1er piso comparten las mismas
  // esquinas — la huella no cambia de un piso a otro.
  // ---------------------------------------------------------------
  const OVERLAY_CORNERS = {
    topLeft: { lat: -34.8460505, lng: -56.0296037 },
    topRight: { lat: -34.8458973, lng: -56.0290845 },
    bottomLeft: { lat: -34.8469380, lng: -56.0291719 }
  };
  const ROTATED_ZOOM_THRESHOLD = 20; // a partir de este zoom se revela el plano

  function addRotatedOverlay(floor, corners) {
    const stage = document.createElement("div");
    stage.style.cssText = "position:absolute;transform-origin:0 0;opacity:0;visibility:hidden;transition:opacity 0.25s ease;pointer-events:none;";
    const img = document.createElement("img");
    img.src = floor.image;
    img.style.cssText = "display:block;width:100%;height:100%;pointer-events:none;";
    stage.appendChild(img);
    (floor.spots || []).forEach(sp => spotEls(sp, floor.size).forEach(el => stage.appendChild(el)));
    map.getPanes().overlayPane.appendChild(stage);

    let visible = false;
    function reposition() {
      const w = img.naturalWidth, h = img.naturalHeight;
      if (!w || !h) return;
      const tl = map.latLngToLayerPoint(corners.topLeft);
      const tr = map.latLngToLayerPoint(corners.topRight);
      const bl = map.latLngToLayerPoint(corners.bottomLeft);
      const a = (tr.x - tl.x) / w, b = (tr.y - tl.y) / w;
      const c = (bl.x - tl.x) / h, d = (bl.y - tl.y) / h;
      stage.style.width = w + "px";
      stage.style.height = h + "px";
      stage.style.left = tl.x + "px";
      stage.style.top = tl.y + "px";
      stage.style.transform = "matrix(" + a + "," + b + "," + c + "," + d + ",0,0)";
    }
    img.addEventListener("load", reposition);
    map.on("move zoom viewreset", reposition);

    return {
      show() { visible = true; stage.style.visibility = "visible"; stage.style.opacity = "1"; reposition(); },
      hide() { visible = false; stage.style.opacity = "0"; stage.style.visibility = "hidden"; },
      isVisible() { return visible; }
    };
  }

  const rotatedOverlays = {};
  FLOORS.forEach(f => { rotatedOverlays[f.id] = addRotatedOverlay(f, f.corners || OVERLAY_CORNERS); });

  // Otros edificios con plano propio (un solo piso): se ven al hacer zoom, igual que el principal.
  // DGIA, y el edificio largo completo (Personal Aeronáutico + oficinas + Registro Nacional de Aeronaves), con sus cámaras de fotos.
  const BUILDINGS = [
    {
      id: "dgia", image: "plano-dgia.png", size: [477, 1062],
      corners: { topLeft: { lat: -34.8460030, lng: -56.0291073 }, topRight: { lat: -34.8459527, lng: -56.0289425 }, bottomLeft: { lat: -34.8463052, lng: -56.0289715 } },
      spots: [
        { id: "dgia_secretaria", title: "DGIA · Secretaría", sub: "Vista desde la puerta de entrada",
          x: 293, y: 246, w: 166, h: 149, bx: 406, by: 320, photos: ["foto-dgia-secretaria.jpg"] },
        { id: "dgia_direccion", title: "DGIA · Dirección", sub: "Puerta de la Dirección",
          x: 121, y: 91, w: 119, h: 113, bx: 192, by: 148, photos: ["foto-dgia-direccion.jpg"] }
      ]
    },
    {
      id: "rnapers", image: "plano-rna-pers.png", size: [1686, 997],
      corners: { topLeft: { lat: -34.8459660, lng: -56.0286417 }, topRight: { lat: -34.8457975, lng: -56.0280562 }, bottomLeft: { lat: -34.8462511, lng: -56.0285197 } },
      spots: [
        { id: "rna_puerta", title: "Registro Nacional de Aeronaves", sub: "Puerta de entrada · atención al público: lunes a viernes, 9 a 13 h",
          x: 1010, y: 383, w: 122, h: 134, bx: 1087, by: 451, photos: ["foto-rna-puerta.jpg"] },
        { id: "pers_puerta", title: "Personal Aeronáutico", sub: "Puerta de entrada (doble hoja de vidrio)",
          x: 448, y: 400, w: 143, h: 116, bx: 493, by: 451, photos: ["foto-pers-aero-puerta.jpg"] },

  ];

  function updateRotatedOverlayVisibility() {

  }
  map.on("zoomend", updateRotatedOverlayVisibility);
  // ---------------------------------------------------------------
  // GESTOS: doble toque = acercar, un toque = alejar.
  // Un toque en el vacío espera un instante por si viene el segundo; si hay
  // una tarjeta de foto abierta, ese toque solo la cierra (no aleja).
  // Los toques sobre pines, cámaras, botones y el panel no cuentan.
  // ---------------------------------------------------------------
  map.doubleClickZoom.disable();
  const TAP_ESPERA = 300; // ms para distinguir uno de dos toques
  let tapTimer = null, tapAnterior = 0;

    const ahora = Date.now();
    if (tapTimer && ahora - tapAnterior < TAP_ESPERA + 120) {
      clearTimeout(tapTimer); tapTimer = null;
      map.setZoomAround(e.containerPoint, Math.min(map.getZoom() + 1, map.getMaxZoom()));
    } else {
      tapAnterior = ahora;
      tapTimer = setTimeout(() => {
        tapTimer = null;
        map.setZoom(Math.max(map.getZoom() - 1, map.getMinZoom()));

  let pistaMode = false;
  let qrRef = null;        // punto de check-in por QR (si entró por un QR)
  let currentRoute = null; // ruta activa del panel "cómo llegar"

  let userLatLng = null;

      [-34.8463300, -56.0288267],

  // Los caminos se dibujan como las calles del mapa: relleno claro con borde suave.
  // El ancho está en metros, así que crece al hacer zoom igual que una calle real.
  const callesitas = [];
  function metrosPorPixel(zoom) { return 156543.03 * Math.cos(34.846 * Math.PI / 180) / Math.pow(2, zoom); }
  function dibujarCamino(pts, anchoM, relleno, borde, texto, caps) {
    const casing = L.polyline(pts, { color: borde, weight: 6, opacity: 1, lineCap: caps, lineJoin: "round", interactive: false }).addTo(map);
    const fill = L.polyline(pts, { color: relleno, weight: 4, opacity: 1, lineCap: caps, lineJoin: "round" })
      .addTo(map).bindTooltip(texto, { sticky: true });
    callesitas.push({ casing, fill, anchoM });
  }
  function ajustarCallesitas() {
    const mpp = metrosPorPixel(map.getZoom());
    callesitas.forEach(c => {
      const w = Math.max(3, c.anchoM / mpp);
      c.fill.setStyle({ weight: w });
      c.casing.setStyle({ weight: w + Math.max(2, 0.7 / mpp) });
    });
  }
  map.on("zoom zoomend", ajustarCallesitas);
  dibujarCamino(CAMINO_DGIA, 2.0, "#ffffff", "#bcd9f0", "Camino a DGIA · unos 45 m a pie", "butt");   // extremos rectos: no pisan la calle ni el edificio
  dibujarCamino(CAMINO_DGIA_ACCESO, 2.0, "#ffffff", "#bcd9f0", "Camino al DGIA, pegado al muro del lado este", "butt");
  const PASARELA_RNA = [
      [-34.8460375, -56.0283869],
      [-34.8459967, -56.0282452]

  ajustarCallesitas();

  POIS.forEach(poi => {
    const marker = L.marker([poi.lat, poi.lng], { icon: poiIcon(poi, false), interactive: !poi.hidePin })
      .addTo(map)
      .bindPopup("<b>" + poi.name + "</b>" + (poi.sub ? "<br>" + poi.sub : ""));

    poiMarkers[poi.id] = marker;
  });

  // ---------------------------------------------------------------
  // LISTA INFERIOR
  // ---------------------------------------------------------------
  const listEl = document.getElementById("list");

  function haversine(a, b) {
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
    const s = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
  }

  function renderList() {
    listEl.innerHTML = "";
    POIS.forEach(poi => {
      const row = document.createElement("div");
      row.className = "poi" + (poi.id === selectedId ? " selected" : "");
      let distTxt = "";
      if (userLatLng) {
        const d = Math.round(haversine(userLatLng, poi));
        distTxt = d < 1000 ? d + " m" : (d/1000).toFixed(1) + " km";
      }
      row.innerHTML =
        '<div class="poi-ico">' + poi.icon + '</div>' +
        '<div class="poi-txt"><div class="poi-name">' + poi.name + '</div>' +
        (poi.sub ? '<div class="poi-sub">' + poi.sub + '</div>' : '') + '</div>' +
        '<div class="poi-dist">' + (poi.photos && poi.photos.length ? '📷 ' : '') + distTxt + '</div>';
      row.addEventListener("click", () => selectPoi(poi.id, true));
      listEl.appendChild(row);
    });
  }

  function selectPoi(id, flyTo) {
    selectedId = id;
    renderList();
    const poi = POIS.find(p => p.id === id);
    if (flyTo) map.flyTo([poi.lat, poi.lng], 19, { duration: 0.6 });
    poiMarkers[id].openPopup();
    drawRoute(poi);
    setSheetCollapsed(true);
    if (poi.floor) setFloor(poi.floor);
    renderPhotoStrip(poi);
  }

  function setSheetCollapsed(collapsed) {
    sheetCollapsed = collapsed;
    document.getElementById("sheet").classList.toggle("collapsed", collapsed);
    document.getElementById("locateBtn").classList.toggle("raised", !collapsed);
    document.getElementById("accBadge").classList.toggle("raised", !collapsed);
    document.getElementById("locMenu").classList.toggle("raised", !collapsed);
    document.getElementById("locHint").classList.toggle("raised", !collapsed);
    document.getElementById("photoStrip").style.bottom = collapsed ? "78px" : "calc(46vh + 14px)";
  }
  let sheetCollapsed = false;
  document.getElementById("sheetTitle").addEventListener("click", () => {
    setSheetCollapsed(!sheetCollapsed);
  });

  // ---------------------------------------------------------------
  // FOTOS — tira de miniaturas del lugar seleccionado + lightbox
  // ---------------------------------------------------------------
  const photoStripEl = document.getElementById("photoStrip");
  const lightboxEl = document.getElementById("lightbox");
  const lightboxImgEl = document.getElementById("lightboxImg");
  const lightboxStageEl = document.getElementById("lightboxStage");

  function renderPhotoStrip(poi) {
    photoStripEl.innerHTML = "";
    if (!poi.photos || poi.photos.length === 0) {
      photoStripEl.classList.remove("show");
      return;
    }
    poi.photos.forEach(src => {
      const img = document.createElement("img");
      img.src = src;
      img.alt = poi.name;
      img.addEventListener("click", () => openLightbox(src, poi.name));
      photoStripEl.appendChild(img);
    });
    photoStripEl.classList.add("show");
  }

  function openLightbox(src, alt, isPlan, floor) {
    lightboxImgEl.src = src;
    lightboxImgEl.alt = alt;
    lightboxEl.classList.add("show");
    resetPinchZoom();
    lightboxImgEl.classList.toggle("zoomable", !!isPlan);
    document.getElementById("lightboxHint").style.display = isPlan ? "block" : "none";
    lightboxStageEl.querySelectorAll("[data-lb-spot]").forEach(el => el.remove());
    if (isPlan && floor) {
      const rs = navLightboxRoute(floor);
      if (rs) { rs.dataset.lbSpot = "1"; lightboxStageEl.appendChild(rs); }
    }
    if (isPlan && floor && floor.spots) {
      floor.spots.forEach(sp => spotEls(sp, floor.size).forEach(el => {
        el.dataset.lbSpot = "1";
        lightboxStageEl.appendChild(el);
      }));
    }
  }
  function closeLightbox() {
    lightboxEl.classList.remove("show");
    hideSpotCard();
  }
  document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
  lightboxEl.addEventListener("click", e => {
    if (e.target === lightboxEl) closeLightbox();
  });

  // ---------------------------------------------------------------
  // ZONAS TOCABLES + TARJETA CON FOTO (como los lugares de Google Maps)
  // ---------------------------------------------------------------

  function spotEls(spot, size) {
    const pct = (v, t) => (v / t * 100) + "%";
    const open = ev => { ev.stopPropagation(); openSpot(spot); };
    const hit = document.createElement("div");
    hit.className = "spotHit";
    hit.style.left = pct(spot.x, size[0]); hit.style.top = pct(spot.y, size[1]);
    hit.style.width = pct(spot.w, size[0]); hit.style.height = pct(spot.h, size[1]);
    hit.addEventListener("click", open);
    const els = [hit];
    if (spot.badge !== false) {
      const b = document.createElement("div");
      b.className = "spotBadge";
      const bx = spot.bx !== undefined ? spot.bx : spot.x + spot.w - 40;
      const by = spot.by !== undefined ? spot.by : spot.y + 40;
      b.style.left = pct(bx, size[0]); b.style.top = pct(by, size[1]);
      b.style.width = pct(CAMARA_PX, size[0]);   // mismo tamaño real en todos los planos (todos tienen la misma escala)
      b.innerHTML = CAMERA_SVG;
      b.addEventListener("click", open);
      els.push(b);
    }
    return els;
  }

  const spotCardEl = document.getElementById("spotCard");
  const spotPhotosEl = document.getElementById("spotPhotos");
  const spotDotsEl = document.getElementById("spotDots");
  const photoViewerEl = document.getElementById("photoViewer");

  function openSpot(spot) {
    spotPhotosEl.innerHTML = "";
    spotDotsEl.innerHTML = "";
    const photos = spot.photos || [];
    photos.forEach((src, i) => {
      const im = document.createElement("img");
      im.src = src; im.alt = spot.title;
      im.addEventListener("click", () => {
        document.getElementById("photoViewerImg").src = src;
        photoViewerEl.classList.add("show");
      });
      spotPhotosEl.appendChild(im);
      if (photos.length > 1) {
        const d = document.createElement("i");
        if (i === 0) d.className = "on";
        spotDotsEl.appendChild(d);
      }
    });
    document.getElementById("spotTitle").textContent = spot.title;
    document.getElementById("spotSub").textContent = spot.sub || "";
    spotCardEl.classList.add("show");
    spotPhotosEl.scrollLeft = 0;
    if (!lightboxEl.classList.contains("show")) setSheetCollapsed(true);
  }
  function hideSpotCard() { spotCardEl.classList.remove("show"); }
  spotPhotosEl.addEventListener("scroll", () => {
    const i = Math.round(spotPhotosEl.scrollLeft / (spotPhotosEl.clientWidth || 1));
    Array.prototype.forEach.call(spotDotsEl.children, (d, j) => { d.className = j === i ? "on" : ""; });
  });
  document.getElementById("spotClose").addEventListener("click", hideSpotCard);
  photoViewerEl.addEventListener("click", () => photoViewerEl.classList.remove("show"));

  // --- Pellizcar para agrandar / arrastrar para mover (solo planos) ---
  let pz = { scale: 1, x: 0, y: 0 };
  function resetPinchZoom() {
    pz = { scale: 1, x: 0, y: 0 };
    applyPinchZoom();
  }
  function applyPinchZoom() {
    lightboxStageEl.style.transform = "translate(" + pz.x + "px," + pz.y + "px) scale(" + pz.scale + ")";
  }
  let pinchStartDist = null, pinchStartScale = 1;
  let dragStart = null, dragOrigin = null;

  lightboxStageEl.addEventListener("touchstart", e => {
    if (!lightboxImgEl.classList.contains("zoomable")) return;
    if (e.touches.length === 2) {
      pinchStartDist = touchDist(e.touches);
      pinchStartScale = pz.scale;
    } else if (e.touches.length === 1) {
      dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      dragOrigin = { x: pz.x, y: pz.y };
    }
  }, { passive: true });

  lightboxStageEl.addEventListener("touchmove", e => {
    if (!lightboxImgEl.classList.contains("zoomable")) return;
    if (e.touches.length === 2 && pinchStartDist) {
      e.preventDefault();
      const d = touchDist(e.touches);
      pz.scale = Math.min(5, Math.max(1, pinchStartScale * (d / pinchStartDist)));
      applyPinchZoom();
    } else if (e.touches.length === 1 && dragStart && pz.scale > 1) {
      e.preventDefault();
      pz.x = dragOrigin.x + (e.touches[0].clientX - dragStart.x);
      pz.y = dragOrigin.y + (e.touches[0].clientY - dragStart.y);
      applyPinchZoom();
    }
  }, { passive: false });

  lightboxStageEl.addEventListener("touchend", e => {
    if (e.touches.length === 0) { pinchStartDist = null; dragStart = null; }
  });

  lightboxStageEl.addEventListener("dblclick", () => resetPinchZoom());

  function touchDist(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  // ---------------------------------------------------------------
  // PISOS — overlay del plano + filtro de pines por piso activo
  // ---------------------------------------------------------------
  let activeFloor = null;

  function setupFloorSelector() {
    const wrap = document.getElementById("floorSelector");
    if (FLOORS.length === 0) return;
    wrap.classList.add("show");
    FLOORS.forEach(f => {
      const btn = document.createElement("button");
      btn.textContent = f.label;
      btn.dataset.floorId = f.id;
      btn.addEventListener("click", () => {
        setFloor(activeFloor === f.id ? null : f.id);
        openLightbox(f.image, "Plano — " + f.label, true, f);
      });
      wrap.appendChild(btn);
    });
  }

  function setFloor(floorId) {
    activeFloor = floorId;
    document.querySelectorAll("#floorSelector button").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.floorId === floorId);
    });
    // Los puntos sin "floor" asignado siempre se ven; los que tienen
    // floor solo se muestran cuando coincide con el piso activo (o si
    // no hay ningún piso activo, se muestran todos).
    POIS.forEach(poi => {
      const marker = poiMarkers[poi.id];
      const visible = !poi.floor || !floorId || poi.floor === floorId;
      if (visible && !map.hasLayer(marker)) marker.addTo(map);
      if (!visible && map.hasLayer(marker)) map.removeLayer(marker);
    });
    updateRotatedOverlayVisibility();
    renderRoute();
  }

  setupFloorSelector();
  setFloor(FLOORS[0] && FLOORS[0].id);

  // ---------------------------------------------------------------
  // CHECK-IN POR QR — si la URL trae ?ref=id (lo que trae el QR
  // pegado en el edificio), usamos ESA posición fija como "acá estás"
  // en vez de esperar al GPS, que adentro no anda. Si además el QR
  // apunta a un piso con plano cargado, lo activamos automáticamente.
  // ---------------------------------------------------------------
  function applyQrCheckIn() {
    const params = new URLSearchParams(window.location.search);
    const refId = params.get("ref");
    if (!refId) return false;
    const ref = QR_REFS.find(r => r.id === refId);
    if (!ref) return false;
    qrRef = ref;

    userLatLng = { lat: ref.lat, lng: ref.lng };
    if (!userMarker) {
      userMarker = L.marker([ref.lat, ref.lng], { icon: userIcon(pistaMode), zIndexOffset: 1000 }).addTo(map);
    } else {
      userMarker.setLatLng([ref.lat, ref.lng]);
    }
    if (accuracyCircle) { map.removeLayer(accuracyCircle); accuracyCircle = null; }

    const badge = document.getElementById("accBadge");
    badge.classList.add("show");
    badge.classList.remove("warn");
    badge.textContent = "📌 Ubicación por QR: " + ref.label;

    if (ref.floor) setFloor(ref.floor);
    map.setView([ref.lat, ref.lng], 19);
    renderList();
    return true;
  }

  const checkedInByQr = applyQrCheckIn();
  // Si no vino de un QR, seguimos con el GPS normal como hasta ahora.
  if (!checkedInByQr) startWatch();

  // ---------------------------------------------------------------
  // MODO PISTA — dibuja el trayecto como línea de pista punteada
  // ---------------------------------------------------------------
  function clearRoutes() {
    Object.values(routeLines).forEach(layers => layers.forEach(l => map.removeLayer(l)));
    for (const k in routeLines) delete routeLines[k];
  }

  function drawRoute(poi) {
    clearRoutes();
    if (!userLatLng) return;
    const path = [userLatLng];
    if (poi.via) poi.via.forEach(v => path.push(v));
    path.push({ lat: poi.lat, lng: poi.lng });

    const latlngs = path.map(p => [p.lat, p.lng]);
    const layers = [];

    if (pistaMode) {
      // Franja de asfalto (base ancha) + línea central de pista punteada
      layers.push(L.polyline(latlngs, {
        color: "#2b2f36", weight: 16, opacity: 0.9, lineCap: "round", lineJoin: "round"
      }).addTo(map));
      layers.push(L.polyline(latlngs, {
        color: "#3a3f47", weight: 12, opacity: 0.9, lineCap: "round", lineJoin: "round"
      }).addTo(map));
      layers.push(L.polyline(latlngs, {
        color: "#ffffff", weight: 3, dashArray: "16 14", opacity: 0.95, lineCap: "round"
      }).addTo(map));
    } else {
      layers.push(L.polyline(latlngs, {
        color: "#2e6db4", weight: 3, dashArray: "6 8", lineCap: "round"
      }).addTo(map));
    }
    routeLines[poi.id] = layers;
  }

  document.getElementById("pistaBtn").addEventListener("click", () => {
    pistaMode = !pistaMode;
    document.getElementById("pistaBtn").classList.toggle("active", pistaMode);
    document.getElementById("modeLabel").textContent = pistaMode ? "Modo pista" : "Modo normal";
    POIS.forEach(poi => poiMarkers[poi.id].setIcon(poiIcon(poi, pistaMode)));
    if (userMarker) userMarker.setIcon(userIcon(pistaMode));
    if (selectedId) drawRoute(POIS.find(p => p.id === selectedId));
    mostrarToast(pistaMode
      ? "✈️ Modo pista: tu ubicación se ve como un avioncito, los lugares en dorado y la línea hacia cada lugar, como una pista."
      : "Modo normal.", 5200);
  });

  // ---------------------------------------------------------------
  // GEOLOCALIZACIÓN EN VIVO
  // ---------------------------------------------------------------
  function userIcon(plane) {
    return L.divIcon({
      className: "",
      html: plane ? '<div class="divicon-user plane">✈️</div>' : '<div class="mono"><svg viewBox="0 0 40 52"><ellipse cx="20" cy="49" rx="11" ry="2.8" fill="rgba(13,43,78,0.28)"/><path d="M8.5 45 C8.5 32 12.5 25 20 25 C27.5 25 31.5 32 31.5 45 C31.5 46.4 30.4 47.5 29 47.5 L11 47.5 C9.6 47.5 8.5 46.4 8.5 45 Z" fill="#2e6db4" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/><circle cx="20" cy="13" r="9.5" fill="#2e6db4" stroke="#ffffff" stroke-width="3"/></svg></div>',
      iconSize: plane ? [30, 30] : [36, 48],
      iconAnchor: plane ? [15, 15] : [18, 45]
    });
  }


  function updateUserPosition(lat, lng, accuracy) {
    gpsFix = { lat, lng, accuracy };
    if (manualMode) return;               // si marcó el punto a mano, el GPS no lo mueve
    userLatLng = { lat, lng };
    if (!userMarker) {
      userMarker = L.marker([lat, lng], {
        icon: userIcon(pistaMode),
        zIndexOffset: 1000
      }).addTo(map);
    } else {
      userMarker.setLatLng([lat, lng]);
    }
    if (!accuracyCircle) {
      accuracyCircle = L.circle([lat, lng], { radius: accuracy, color: "#2e6db4", weight: 1, fillOpacity: 0.08 }).addTo(map);
    } else {
      accuracyCircle.setLatLng([lat, lng]);
      accuracyCircle.setRadius(accuracy);
    }
    updateAccBadge(accuracy);
    revisarInterior(lat, lng);
    renderList();
    if (selectedId) drawRoute(POIS.find(p => p.id === selectedId));
  }

  const ACC_WARN_THRESHOLD = 25; // metros — a partir de acá avisamos que la precisión es baja
  function updateAccBadge(accuracy) {
    const badge = document.getElementById("accBadge");
    const bad = accuracy > ACC_WARN_THRESHOLD;
    badge.classList.add("show");
    badge.classList.toggle("warn", bad);
    badge.textContent = bad
      ? "📶 Precisión baja (±" + Math.round(accuracy) + " m) — típico en interiores"
      : "📍 ±" + Math.round(accuracy) + " m";
  }

  function startWatch() {
    if (!navigator.geolocation || vigilando) return;
    vigilando = true;
    navigator.geolocation.watchPosition(
      pos => updateUserPosition(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy || 15),
      err => console.warn("Geolocalización no disponible:", err.message),
      { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
    );
  }

  // ---------------------------------------------------------------
  // PUNTO DE PARTIDA A MANO — la personita se ubica donde la persona toca
  // (adentro de los edificios el GPS suele fallar o correrse varios metros)
  // ---------------------------------------------------------------
  const locMenu = document.getElementById("locMenu"), locHint = document.getElementById("locHint");
  const toastEl = document.getElementById("toastMsg");
  let toastTimer = null;
  function mostrarToast(txt, ms) {
    toastEl.textContent = txt; toastEl.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove("show"), ms || 4500);
  }
  function ocultarHint() { locHint.classList.remove("show"); }
  setTimeout(() => { if (!manualMode) locHint.classList.add("show"); }, 1500);
  setTimeout(ocultarHint, 10000);

  document.getElementById("locateBtn").addEventListener("click", e => {
    e.stopPropagation(); ocultarHint();
    document.getElementById("locGps").style.display = manualMode ? "flex" : "none";
    locMenu.classList.toggle("show");
  });
  document.addEventListener("click", e => { if (!locMenu.contains(e.target)) locMenu.classList.remove("show"); });

  document.getElementById("locIr").addEventListener("click", () => {
    locMenu.classList.remove("show");
    if (userLatLng) map.flyTo([userLatLng.lat, userLatLng.lng], 19, { duration: 0.6 });
    else { startWatch(); mostrarToast("Todavía no tengo tu ubicación. Si estás adentro de un edificio, probá marcar tu punto de partida a mano.", 6000); }
  });
  document.getElementById("locManual").addEventListener("click", () => { locMenu.classList.remove("show"); entrarModoColocar(); });
  document.getElementById("locGps").addEventListener("click", () => { locMenu.classList.remove("show"); usarGPS(); });

  function entrarModoColocar() {
    colocando = true;
    document.getElementById("avisoInterior").classList.remove("show");
    document.getElementById("colocarBanner").classList.add("show");
    document.getElementById("map").classList.add("colocando");
    setSheetCollapsed(true);
  }
  function salirModoColocar() {
    colocando = false;
    document.getElementById("colocarBanner").classList.remove("show");
    document.getElementById("map").classList.remove("colocando");
  }
  document.getElementById("colocarCancelar").addEventListener("click", salirModoColocar);

  function colocarPunto(latlng) {
    salirModoColocar();
    manualMode = true; qrRef = null;
    startFloor = (typeof activeFloor !== "undefined" && activeFloor) ? activeFloor : "pb";
    userLatLng = { lat: latlng.lat, lng: latlng.lng };
    if (!userMarker) {
      userMarker = L.marker(latlng, { icon: userIcon(pistaMode), zIndexOffset: 1000, draggable: true }).addTo(map);
    } else {
      userMarker.setLatLng(latlng);
      if (userMarker.dragging) userMarker.dragging.enable();
    }
    userMarker.off("dragend");
    userMarker.on("dragend", () => {
      const q = userMarker.getLatLng(); userLatLng = { lat: q.lat, lng: q.lng };
      renderList(); if (selectedId) drawRoute(POIS.find(p => p.id === selectedId));
    });
    userMarker.unbindTooltip();
    userMarker.bindTooltip("Tu punto de partida", { permanent: true, direction: "top", offset: [0, -46], className: "tipPartida" }).openTooltip();
    if (accuracyCircle) { map.removeLayer(accuracyCircle); accuracyCircle = null; }
    const badge = document.getElementById("accBadge");
    badge.classList.add("show"); badge.classList.remove("warn"); badge.textContent = "📌 Punto de partida marcado a mano";
    navPreferGps = true;
    renderList(); if (selectedId) drawRoute(POIS.find(p => p.id === selectedId));
    mostrarToast("Listo. Podés arrastrar la personita para ajustarla. En 🧭 el origen queda como «Donde marqué mi punto de partida».", 6500);
  }

  function usarGPS() {
    manualMode = false; salirModoColocar();
    if (userMarker) { userMarker.unbindTooltip(); if (userMarker.dragging) userMarker.dragging.disable(); }
    if (gpsFix) {
      updateUserPosition(gpsFix.lat, gpsFix.lng, gpsFix.accuracy);
      mostrarToast("Volví a usar el GPS.", 3500);
    } else {
      if (userMarker) { map.removeLayer(userMarker); userMarker = null; }
      userLatLng = null; document.getElementById("accBadge").classList.remove("show");
      startWatch(); mostrarToast("Esperando la señal del GPS…", 3500);
    }
  }

  // ----- aviso cuando el GPS lo ubica adentro de un edificio -----
  function paramEnEsquinas(c, lat, lng) {
    const a11 = c.topRight.lat - c.topLeft.lat, a12 = c.bottomLeft.lat - c.topLeft.lat;
    const a21 = c.topRight.lng - c.topLeft.lng, a22 = c.bottomLeft.lng - c.topLeft.lng;
    const det = a11 * a22 - a12 * a21, dl = lat - c.topLeft.lat, dg = lng - c.topLeft.lng;
    return [(dl * a22 - a12 * dg) / det, (a11 * dg - a21 * dl) / det];
  }
  function dentroDeEdificio(lat, lng) {
    const px = navLatLngToPx(lat, lng);
    const en = (x0, y0, x1, y1) => px[0] >= x0 && px[0] <= x1 && px[1] >= y0 && px[1] <= y1;
    if (en(377, 18, 893, 1806) || en(32, 1806, 1413, 2358)) return "edificio principal";
    const nombres = { dgia: "edificio del DGIA", rnapers: "edificio de Personal Aeronáutico y del Registro Nacional de Aeronaves" };
    for (const bd of BUILDINGS) {
      const uv = paramEnEsquinas(bd.corners, lat, lng);
      if (uv[0] >= 0 && uv[0] <= 1 && uv[1] >= 0 && uv[1] <= 1) return nombres[bd.id] || "edificio";
    }
    return null;
  }
  function revisarInterior(lat, lng) {
    const aviso = document.getElementById("avisoInterior");
    const donde = dentroDeEdificio(lat, lng);
    if (!donde) { avisoInteriorVisto = false; aviso.classList.remove("show"); return; }
    if (avisoInteriorVisto || manualMode || colocando) return;
    avisoInteriorVisto = true;
    document.getElementById("avisoTxt").innerHTML = "<b>Parece que estás adentro del " + donde + ".</b> Adentro de los edificios la ubicación a veces es difícil de tomar para el celular y puede marcar corrida varios metros. Te recomiendo agregar tu punto de partida a mano.";
    aviso.classList.add("show");
  }
  document.getElementById("avisoSigue").addEventListener("click", () => document.getElementById("avisoInterior").classList.remove("show"));
  document.getElementById("avisoMarcar").addEventListener("click", entrarModoColocar);

  renderList();

  // ---------------------------------------------------------------
  // SOMBRAS DE AVIONES — siluetas suaves que cruzan la pantalla de vez en
  // cuando, como si pasaran volando por arriba. Van solas, sin botón
  // (solo se apagan si el celular tiene activado "reducir movimiento").
  // ---------------------------------------------------------------
  const sombrasEl = document.getElementById("sombras");
  const SOMBRA_SVG = '<svg viewBox="0 0 100 100"><rect x="44" y="4" width="12" height="90" rx="6"/><polygon points="50,36 97,66 97,75 50,58 3,75 3,66"/><polygon points="50,80 68,95 68,101 50,95 32,101 32,95"/></svg>';
  const sinMovimiento = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  const sombrasOn = !sinMovimiento;

  function lanzarSombra() {
    if (!sombrasEl.animate) return;
    const W = window.innerWidth, H = window.innerHeight;
    const size = 70 + Math.random() * 90;                       // tamaño de la silueta
    const ang = Math.random() * 2 * Math.PI;                    // rumbo al azar
    const dx = Math.cos(ang), dy = Math.sin(ang);
    const diag = Math.hypot(W, H) + size * 2;
    const off = (Math.random() - 0.5) * Math.min(W, H) * 0.9;   // por dónde cruza
    const cx = W / 2 - dy * off, cy = H / 2 + dx * off;
    const pos = t => "translate(" + (cx + dx * diag * (t - 0.5) - size / 2) + "px," + (cy + dy * diag * (t - 0.5) - size / 2) + "px) rotate(" + (Math.atan2(dx, -dy) * 180 / Math.PI) + "deg)";
    const dur = diag / (45 + Math.random() * 35) * 1000;        // 45 a 80 px por segundo
    const el = document.createElement("div");
    el.className = "sombra"; el.style.width = el.style.height = size + "px"; el.innerHTML = SOMBRA_SVG;
    sombrasEl.appendChild(el);
    const an = el.animate([

    let best = null, bd = Infinity;
    NAV_GEO.forEach(id => { const ll = navLL(id); const d = Math.hypot((userLatLng.lat - ll[0]) * NAV_MLAT, (userLatLng.lng - ll[1]) * NAV_MLNG); if (d < bd) { bd = d; best = id; } });
    if (best && bd < 60) { navOriginLabel = manualMode ? "donde marcaste tu punto de partida" : "donde estás (aprox.)"; return best; }

    });
  }
  function navLightboxRoute(floor) {
    if (!currentRoute || !floor) return null;
    const NS = "http://www.w3.org/2000/svg", W = floor.size[0], H = floor.size[1];
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.style.cssText = "position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;border-radius:10px";
    currentRoute.segments.forEach((seg, i) => {
      if (seg.f !== floor.id || seg.geo) return;
      const pts = seg.pts.map(p => p.join(",")).join(" ");
      [["#ffffff", 26], ["#ff7a00", 14]].forEach(([c, w]) => {
        const pl = document.createElementNS(NS, "polyline");
        pl.setAttribute("points", pts); pl.setAttribute("fill", "none"); pl.setAttribute("stroke", c);
        pl.setAttribute("stroke-width", w); pl.setAttribute("stroke-linecap", "round"); pl.setAttribute("stroke-linejoin", "round");
        svg.appendChild(pl);
      });
      const f0 = seg.pts[0], f1 = seg.pts[seg.pts.length-1], last = i === currentRoute.segments.length - 1;
      [[f0, i === 0 ? "#2e6db4" : "#ff7a00", 22], [f1, last ? "#e53935" : "#ff7a00", 26]].forEach(([p, c, r]) => {
        const ci = document.createElementNS(NS, "circle");
        ci.setAttribute("cx", p[0]); ci.setAttribute("cy", p[1]); ci.setAttribute("r", r);
        ci.setAttribute("fill", c); ci.setAttribute("stroke", "#fff"); ci.setAttribute("stroke-width", 7);
        svg.appendChild(ci);
      });
    });
    return svg;
  }

  // ----- panel -----
  const navDrawer = document.getElementById("navDrawer"), navScrim = document.getElementById("navScrim");
  const navListView = document.getElementById("navListView"), navRouteView = document.getElementById("navRouteView");
  const routeChip = document.getElementById("routeChip");
  function navOpen(show) { navDrawer.classList.toggle("open", show); navScrim.classList.toggle("show", show); if (show) navRenderList(); }
  document.getElementById("navBtn").addEventListener("click", () => { navOpen(true); navListView.style.display = currentRoute ? "none" : "block"; navRouteView.style.display = currentRoute ? "block" : "none"; });
  document.getElementById("navClose").addEventListener("click", () => navOpen(false));
  navScrim.addEventListener("click", () => navOpen(false));

  function navFillFrom() {
    const sel = document.getElementById("navFrom");
    const keep = sel.value;
    sel.innerHTML = "";
    const add = (v, t) => { const o = document.createElement("option"); o.value = v; o.textContent = t; sel.appendChild(o); };
    add("ent", "Puerta de ingreso");
    add("gps", userLatLng ? (manualMode ? "Donde marqué mi punto de partida" : "Donde estoy (aprox.)") : "Donde estoy (esperando ubicación…)");
    NAV_PLACES.filter(p => p.floor === "pb" || p.floor === "dgia").forEach(p => add(p.node, p.name));
    if (navPreferGps && userLatLng) { sel.value = "gps"; navPreferGps = false; }
    else if (keep) sel.value = keep;
  }
  function navRenderList() {
    navFillFrom();
    const wrap = document.getElementById("navPlaces");
    wrap.innerHTML = "";
    const origin = navResolveOrigin(), { dist } = navDijkstra(origin);
    [["pb", "Planta baja"], ["p1", "1er piso"], ["dgia", "Otros edificios"]].forEach(([f, label]) => {
      const g = document.createElement("div"); g.className = "navGroup"; g.textContent = label; wrap.appendChild(g);
      NAV_PLACES.filter(p => p.floor === f).forEach(p => {
        const m = Math.round(dist[p.node] / 5) * 5;
        const row = document.createElement("div"); row.className = "navPlace";
        row.innerHTML = '<div class="ico">' + p.icon + '</div><div class="t"><b>' + p.name + '</b><span>' + p.sub + '</span></div><div class="d">≈ ' + Math.max(m, 5) + ' m' + (f === "p1" ? "<br>por escalera" : "") + '</div>';
        row.addEventListener("click", () => navGo(p));
        wrap.appendChild(row);
      });
    });
  }
  document.getElementById("navFrom").addEventListener("change", navRenderList);

  function navGo(place) {
    const origin = navResolveOrigin();
    if (origin === place.node) { alert("Ya estás ahí 🙂"); return; }
    const { prev } = navDijkstra(origin), path = navPath(prev, place.node);
    const r = navBuild(path, place, origin);
    currentRoute = { place: place, segments: r.segments, steps: r.steps, meters: r.meters, usedStairs: r.usedStairs };
    navShowRouteView();
    navFocus(navGroup(currentRoute.segments[0].f));
  }
  function navShowRouteView() {
    const r = currentRoute;
    navListView.style.display = "none"; navRouteView.style.display = "block";
    document.getElementById("navRouteTitle").textContent = r.place.name;
    const min = Math.max(1, Math.round(r.meters / 70));
    document.getElementById("navRouteMeta").textContent = "≈ " + r.meters + " m caminando · " + min + " min" + (r.usedStairs ? " · con escalera" : "") + " · desde " + navOriginLabel.replace(/^en /, "").replace(/^donde/, "donde");
    const ol = document.getElementById("navSteps"); ol.innerHTML = "";
    let lastF = null, n = 0;
    r.steps.forEach(st => {
      if (st.f !== lastF) { const h = document.createElement("li"); h.className = "piso"; h.textContent = NAV_FLOOR_TXT[st.f]; ol.appendChild(h); lastF = st.f; }
      const li = document.createElement("li"); n++;
      li.innerHTML = '<span class="n">' + n + '</span><span>' + st.text + '</span>';
      ol.appendChild(li);
    });
    const floors = r.segments.map(s => navGroup(s.f)).filter((f, i, a) => a.indexOf(f) === i);
    const bA = document.getElementById("navFloorA"), bB = document.getElementById("navFloorB");
    [bA, bB].forEach((b, i) => { b.style.display = floors[i] ? "block" : "none"; if (floors[i]) { b.textContent = "Ver " + (floors[i] === "p1" ? "1er piso" : "planta baja"); b.onclick = () => { navOpen(false); navFocus(floors[i]); }; } });
    document.getElementById("routeChipTxt").textContent = "➜ " + r.place.name + " · ≈ " + r.meters + " m";
    routeChip.classList.add("show");
  }
  function navFocus(grupo) {
    if (!routeLayer) routeLayer = L.layerGroup().addTo(map);
    setFloor(grupo);
    renderRoute();
    const ll = [];
    currentRoute.segments.forEach(seg => { if (navGroup(seg.f) === grupo) navSegLatLngs(seg).forEach(p => ll.push(p)); });
    const b = L.latLngBounds(ll);
    const z = Math.min(21, Math.max(19, map.getBoundsZoom(b.pad(0.25), false)));
    map.setView(b.getCenter(), z);
    setSheetCollapsed(true);
  }
  document.getElementById("navShow").addEventListener("click", () => { navOpen(false); navFocus(navFloorOfRoute()); });
  document.getElementById("navBack").addEventListener("click", () => { currentRoute = null; renderRoute(); routeChip.classList.remove("show"); navListView.style.display = "block"; navRouteView.style.display = "none"; navRenderList(); });
  document.getElementById("routeChipGo").addEventListener("click", () => { navOpen(true); navListView.style.display = "none"; navRouteView.style.display = "block"; });
  document.getElementById("routeChipX").addEventListener("click", () => { currentRoute = null; renderRoute(); routeChip.classList.remove("show"); });
  routeLayer = L.layerGroup().addTo(map);
})();
</script>
</body>
</html>
