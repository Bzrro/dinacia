name: Actualizar METAR
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  metar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bajar METAR de Carrasco
        run: |
          curl -fsS -A "dinacia-mapa" "https://aviationweather.gov/api/data/metar?ids=SUMU&format=json" -o nuevo.json
          grep -q rawOb nuevo.json && mv nuevo.json metar.json || rm -f nuevo.json
      - name: Guardar si cambió
        run: |
          git config user.name "metar-bot"
          git config user.email "metar-bot@users.noreply.github.com"
          git add metar.json
          git diff --cached --quiet || (git commit -m "METAR SUMU" && git push)
